<!doctype html>
<!--
  Capacitor exige un dossier `webDir` même quand on charge un site distant.
  Cette page n'est jamais affichée — Capacitor redirige immédiatement vers
  https://mytitancloud.com configuré dans capacitor.config.json.
  Elle sert juste de fallback si le réseau est coupé au tout premier launch.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyTitanCloud</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a14;
        color: #f5f5f7;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <p>Chargement de MyTitanCloud…</p>
      <p style="opacity: 0.6; font-size: 0.85rem; margin-top: 1rem;">
        Vérifie ta connexion internet si rien ne se passe.
      </p>
    </div>
  </body>
</html>
