# Build cross-platform des installeurs MyTitanCloud Desktop.
# Déclenché par les tags `desktop-v*` (ex: desktop-v0.1.0).
# Output : .exe (Windows), .dmg (macOS Intel + ARM), .AppImage + .deb (Linux).
# Les artefacts sont uploadés comme assets sur la release GitHub correspondante.

name: Desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # une plateforme qui plante ne bloque pas les autres
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop

    env:
      # Skip code signing — pas de certif Apple/Win en V0
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Pas de publish vers GitHub release ici, on upload les artifacts à la place
      EP_PRE_RELEASE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        continue-on-error: true

      - name: Build macOS installer
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        continue-on-error: true

      - name: Build Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always() # même si le build a un warning, on upload ce qui a marché
        with:
          name: mytitancloud-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn
          retention-days: 30

      # Upload optionnel vers Cloudflare R2 — actif uniquement si les secrets
      # R2_* sont définis dans le repo GitHub (Settings → Secrets → Actions).
      # Permet de servir les installeurs depuis une URL publique sans
      # rendre le repo public.
      - name: Upload installers to R2 (Cloudflare)
        if: always() && env.R2_ENDPOINT != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Install AWS CLI v2 (compatible S3 = R2)
          if ! command -v aws &> /dev/null; then
            python3 -m pip install --quiet awscli || pip install --quiet awscli
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          TAG="${{ github.ref_name }}"
          echo "Uploading installers from desktop/dist/ to R2 bucket $R2_BUCKET under prefix releases/$TAG/"
          aws s3 sync desktop/dist/ "s3://$R2_BUCKET/releases/$TAG/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.exe" \
            --include "*.dmg" \
            --include "*.AppImage" \
            --include "*.deb" || echo "R2 upload partiel ou échoué — voir les logs"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v') && always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyTitanCloud Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## MyTitanCloud Desktop

            Téléchargements officiels :
            - **Windows** : `.exe` (NSIS installer)
            - **macOS** : `.dmg` (Intel + Apple Silicon)
            - **Linux** : `.AppImage` ou `.deb`

            Ouvre simplement l'installeur correspondant à ton OS, double-clique,
            et MyTitanCloud apparaîtra dans tes applications.

            ⚠️ Pas de signature de code en V0 — Windows et macOS afficheront
            un warning au premier lancement, c'est normal.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: false # si certains assets manquent, on publie quand même
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
