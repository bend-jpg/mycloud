# Contrôle qualité avant déploiement.
#
# Il n'existait AUCUNE vérification automatique sur l'application web : les
# deux seuls workflows compilaient les apps desktop et mobile. Chaque push
# partait donc en production via Vercel sans que rien ne garantisse que le
# code compile.
#
# Ce workflow échoue AVANT que Vercel ne promeuve la version : il sert de
# filet minimal (types + build).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Types et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Affiché en clair : sans droits admin sur le dépôt, les journaux
      # détaillés ne sont pas accessibles. Ces lignes suffisent à diagnostiquer
      # un écart d'environnement (version de npm, plateforme) depuis le résumé.
      - name: Diagnostic environnement
        run: |
          echo "node    : $(node --version)"
          echo "npm     : $(npm --version)"
          echo "platform: $(uname -a)"
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"

      # `npm ci` est strict : il refuse le moindre écart avec le fichier de
      # verrouillage. Utile, mais il ne doit pas empêcher la vérification du
      # CODE — qui est la vraie raison d'être de ce workflow. En cas d'échec
      # on bascule sur `npm install` avec un avertissement visible, et les
      # étapes suivantes s'exécutent quand même.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning title=Fichier de verrouillage::npm ci a échoué — repli sur npm install. Lancer 'npm install' en local et commiter package-lock.json."
            npm install --no-audit --no-fund
          }

      # Le client Prisma doit exister avant le typecheck (les types des modèles
      # en dépendent). Normalement déjà généré par le postinstall, mais on le
      # refait pour couvrir le cas du repli ci-dessus.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          # Valeurs factices : le build ne fait aucun appel réseau, mais
          # certains modules lisent ces variables au chargement.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          AUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          NEXTAUTH_URL: http://localhost:3000
