# Contrôle qualité avant déploiement.
#
# Il n'existait AUCUNE vérification automatique sur l'application web : les
# deux seuls workflows compilaient les apps desktop et mobile. Chaque push
# sur main partait donc directement en production via Vercel sans que rien
# ne garantisse que le code compile — une erreur de type ou un import cassé
# n'était découvert qu'une fois le site en ligne.
#
# Ce workflow échoue AVANT que Vercel ne promeuve la version : il sert de
# filet minimal (types + build + tests si présents).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Types, build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Le client Prisma doit exister avant le typecheck : les types des
      # modèles en dépendent.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint
        continue-on-error: true # informatif tant que la base n'est pas propre

      - name: Build
        run: npx next build
        env:
          # Valeurs factices : le build ne fait aucun appel réseau, mais
          # certains modules lisent ces variables au chargement.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          NEXTAUTH_URL: http://localhost:3000
