# Contrôle qualité avant déploiement.
#
# Il n'existait AUCUNE vérification automatique sur l'application web : les
# deux seuls workflows compilaient les apps desktop et mobile. Chaque push
# partait donc en production via Vercel sans que rien ne garantisse que le
# code compile.
#
# Ce workflow échoue AVANT que Vercel ne promeuve la version : il sert de
# filet minimal (types + build).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Types et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Une vraie base de données jetable.
    #
    # Le build Next pré-génère des pages, et celles-ci interrogent la base.
    # Avec une URL factice il échoue — c'est ce qui bloquait ce workflow.
    # Fournir un Postgres réel corrige la cause plutôt que de la contourner,
    # et apporte une vérification qui n'existait nulle part : que les
    # migrations s'appliquent proprement SUR UNE BASE VIERGE. Une migration
    # cassée est maintenant détectée ici, pas en production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mytitancloud_ci
        ports:
          - 5432:5432
        # Sans ces contrôles, les étapes démarrent avant que Postgres
        # accepte les connexions.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mytitancloud_ci
      AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
      AUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Affiché en clair : sans droits admin sur le dépôt, les journaux
      # détaillés ne sont pas accessibles. Ces lignes suffisent à diagnostiquer
      # un écart d'environnement (version de npm, plateforme) depuis le résumé.
      - name: Diagnostic environnement
        run: |
          echo "node    : $(node --version)"
          echo "npm     : $(npm --version)"
          echo "platform: $(uname -a)"
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"

      # `npm ci` est strict : il refuse le moindre écart avec le fichier de
      # verrouillage. Utile, mais il ne doit pas empêcher la vérification du
      # CODE — qui est la vraie raison d'être de ce workflow. En cas d'échec
      # on bascule sur `npm install` avec un avertissement visible, et les
      # étapes suivantes s'exécutent quand même.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning title=Fichier de verrouillage::npm ci a échoué — repli sur npm install. Lancer 'npm install' en local et commiter package-lock.json."
            npm install --no-audit --no-fund
          }

      # Le client Prisma doit exister avant le typecheck (les types des modèles
      # en dépendent). Normalement déjà généré par le postinstall, mais on le
      # refait pour couvrir le cas du repli ci-dessus.
      # Placé avant tout le reste : ne lit que des fichiers, échoue en une
      # seconde. Empêche le retour de la fuite de données du 5 août 2026 —
      # une page admin ajoutée sans contrôle d'accès sert ses données à
      # n'importe qui, sans que ça se voie dans un navigateur.
      - name: Contrôle des gardes du back-office
        run: node scripts/check-admin-guards.js

      - name: Generate Prisma client
        run: npx prisma generate

      # Applique les migrations versionnées sur la base vierge. Vérifie du
      # même coup qu'un déploiement depuis zéro fonctionne — jusqu'ici rien
      # ne le garantissait.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
